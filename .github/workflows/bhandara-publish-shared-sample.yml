name: Publish shared 80-person Bhandara Excel sample

on:
  push:
    branches:
      - feat/bhandara-shared-input-layout-20261112
    paths:
      - ".github/workflows/bhandara-publish-shared-sample.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bhandara-shared-input-layout-20261112
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Generate real reusable 80-person Excel workbooks
        run: python bhandara/examples/sample/generate.py --output-dir bhandara/examples/sample
      - name: Validate fixed-layout Worktime
        shell: bash
        run: |
          set +e
          python run.py bhandara worktime-calculator --period 2026-06 \
            --input-dir bhandara/examples/sample/input \
            --output-dir "$RUNNER_TEMP/worktime"
          status=$?
          set -e
          echo "WORKTIME_EXIT=$status"
          test "$status" -eq 2 || test "$status" -eq 0
          test -s "$RUNNER_TEMP/worktime/worktime-result.json"
          cp "$RUNNER_TEMP/worktime/worktime-result.json" \
             bhandara/examples/sample/input/payroll/worktime-result.json
      - name: Validate fixed-layout PTO
        shell: bash
        run: |
          set +e
          python run.py bhandara pto-calculator --period 2026-07 \
            --input-dir bhandara/examples/sample/input \
            --output-dir "$RUNNER_TEMP/pto"
          status=$?
          set -e
          echo "PTO_EXIT=$status"
          test "$status" -eq 1 || test "$status" -eq 0
          test -s "$RUNNER_TEMP/pto/pto-result.json"
      - name: Validate fixed-layout Payroll
        shell: bash
        run: |
          set +e
          python run.py bhandara payroll-calculator --period 2026-07 \
            --input-dir bhandara/examples/sample/input \
            --output-dir "$RUNNER_TEMP/payroll"
          status=$?
          set -e
          echo "PAYROLL_EXIT=$status"
          test "$status" -eq 2
          test -s "$RUNNER_TEMP/payroll/payroll-calculation.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"])
          for folder, filename in (("pto", "pto-result.json"), ("worktime", "worktime-result.json"), ("payroll", "payroll-calculation.json")):
              data = json.loads((root / folder / filename).read_text())
              print(folder.upper() + "_STATUS=" + data["status"])
              assert data["status"] != "BLOCKED", (folder, data["status"])
          PY
      - name: Publish actual binary workbooks (not generator-only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+seo-an@users.noreply.github.com"
          git add -f bhandara/examples/sample/input bhandara/examples/sample/sample-manifest.json
          test "$(git diff --cached --name-only | grep -c '\.xlsx$')" -ge 10
          git commit -m "test(sample): publish actual 80-person mapped XLSX files"
          git push origin HEAD:feat/bhandara-shared-input-layout-20261112
