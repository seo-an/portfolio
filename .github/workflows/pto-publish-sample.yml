name: Publish durable PTO example spreadsheets

on:
  push:
    branches:
      - feat/pto-published-sample-20261112
    paths:
      - .github/workflows/pto-publish-sample.yml

permissions:
  contents: write

jobs:
  publish-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sample branch
        uses: actions/checkout@v4
        with:
          ref: feat/pto-published-sample-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate actual workbook files into repository
        run: |
          python bhandara/pto-calculator/examples/generate_review_cases.py \
            --output-dir bhandara/pto-calculator/examples/sample
      - name: Validate the 14-person mixed sample with the real CLI
        shell: bash
        run: |
          set +e
          python run.py bhandara pto-calculator \
            --config bhandara/pto-calculator/examples/sample/config.json \
            --input-dir bhandara/pto-calculator/examples/sample/input \
            --output-dir "${RUNNER_TEMP}/pto-sample-output"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Unexpected PTO sample exit code: $code (expected review=1)"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "pto-sample-output"
          result = json.loads((root / "pto-result.json").read_text())
          assert result["status"] == "REVIEW_REQUIRED", result["status"]
          assert len(result["results"]) == 14, len(result["results"])
          assert not result["approved"] and not result["finalizable"]
          print("PUBLISHED_SAMPLE_VALIDATED: 14 synthetic employees")
          PY
      - name: Commit the workbooks to the sample branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bhandara/pto-calculator/examples/sample
          if git diff --cached --quiet; then
            echo "Sample workbooks unchanged."
          else
            git commit -m "test(pto): check in reusable 14-person XLSX sample files"
            git push origin HEAD:feat/pto-published-sample-20261112
          fi
