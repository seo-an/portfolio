name: Bhandara Payroll worker isolation (unittest)

on:
  pull_request:
    paths:
      - "run.py"
      - "bhandara/payroll-calculator/**"
      - "bhandara/tests/test_payroll_worker_isolation.py"
      - ".github/workflows/bhandara-payroll-worker-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-payroll-worker-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install public module dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic worker-level Payroll recovery
        run: python -m unittest discover -s bhandara/tests -p "test_payroll_worker_isolation.py" -v
      - name: Unchanged migration contract and standalone regression
        run: python -m unittest discover -s bhandara/tests -p "test_payroll_migration.py" -v
      - name: Single-module isolation regression
        run: python -m unittest discover -s bhandara/tests -p "test_module_isolation.py" -v
