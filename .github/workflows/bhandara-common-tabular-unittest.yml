name: Bhandara Common input and Normalizer unittest

on:
  pull_request:
    paths:
      - "bhandara/common/**"
      - "bhandara/tests/test_common_*.py"
      - "bhandara/tests/test_calamine_reader_contract.py"
      - "bhandara/tests/test_retired_calculator_removal.py"
      - "run.py"
      - "install.py"
      - "requirements.txt"
      - ".github/workflows/bhandara-common-tabular-unittest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Common Normalizer, tabular and strict XLSX contracts
        run: |
          python -m unittest \
            bhandara.tests.test_common_runner_v2 \
            bhandara.tests.test_common_tabular_normalization \
            bhandara.tests.test_common_xlsx_stream_contract \
            bhandara.tests.test_common_xlsx_validation_stream \
            bhandara.tests.test_common_security_person_map \
            bhandara.tests.test_calamine_reader_contract \
            bhandara.tests.test_retired_calculator_removal -v
