name: Worktime factual output unittest

on:
  pull_request:
    paths:
      - "bhandara/worktime/**"
      - "bhandara/tests/test_worktime_schedule_mapping.py"
      - "bhandara/tests/test_worktime_output_v01.py"
      - ".github/workflows/worktime-output-unittest.yml"
  workflow_dispatch:

jobs:
  worktime-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: New Worktime mapping and output tests
        run: |
          python -m unittest             bhandara.tests.test_worktime_schedule_mapping             bhandara.tests.test_worktime_output_v01 -v
      - name: Existing Worktime module regression
        run: |
          python -m unittest             bhandara.tests.test_worktime_schedule             bhandara.tests.test_worktime_attendance_verification             bhandara.tests.test_worktime_attendance_deviations             bhandara.tests.test_worktime_compliance             bhandara.tests.test_worktime_rest_deviations -v
