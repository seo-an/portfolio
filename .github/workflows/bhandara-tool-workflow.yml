name: Bhandara Tool Workflow Handoff

on:
  pull_request:
    paths:
      - "bhandara/workflow.py"
      - "bhandara/workflow.example.json"
      - "bhandara/tests/test_workflow_tool_handoff.py"
      - "run.py"
      - ".github/workflows/bhandara-tool-workflow.yml"
  workflow_dispatch:

jobs:
  workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Tool handoff, approval and reuse guards
        run: |
          python -m unittest bhandara.tests.test_workflow_tool_handoff -v
          python -m unittest bhandara.tests.test_pto_json_tool_cli bhandara.tests.test_worktime_json_tool_cli bhandara.tests.test_payroll_json_tool_cli -v
