name: Publish Bhandara contract wage Excel sample once

on:
  push:
    branches:
      - feat/payroll-contract-basis-20261112
    paths:
      - ".github/workflows/bhandara-publish-contract-sample-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payroll-contract-basis-20261112
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Generate real mixed wage contracts
        run: |
          python bhandara/examples/sample/generate.py --output-dir "$RUNNER_TEMP/generated"
          test -f "$RUNNER_TEMP/generated/input/payroll/pay-contract.xlsx"
          test -f "$RUNNER_TEMP/generated/input/payroll/service-contracts.xlsx"
          cp "$RUNNER_TEMP/generated/input/payroll/pay-contract.xlsx" \
            bhandara/examples/sample/input/payroll/
          cp "$RUNNER_TEMP/generated/input/payroll/pay-contract-components.xlsx" \
            bhandara/examples/sample/input/payroll/
          cp "$RUNNER_TEMP/generated/input/payroll/service-contracts.xlsx" \
            bhandara/examples/sample/input/payroll/
          cp "$RUNNER_TEMP/generated/input/payroll/company-policy.json" \
            bhandara/examples/sample/input/payroll/company-policy.json
          cp "$RUNNER_TEMP/generated/sample-manifest.json" \
            bhandara/examples/sample/sample-manifest.json
          git rm bhandara/examples/sample/input/payroll/compensation.xlsx
      - name: Run real contract Payroll from shared Excel
        shell: bash
        run: |
          set +e
          python run.py bhandara payroll-calculator --period 2026-07 \
            --input-dir bhandara/examples/sample/input \
            --output-dir "$RUNNER_TEMP/payroll"
          code=$?
          set -e
          echo "PAYROLL_CODE=$code"
          test "$code" -eq 2
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"payroll"
          payroll=json.loads((root/"payroll-calculation.json").read_text())
          review=json.loads((root/"contract-basis-review.json").read_text())
          print("PAYROLL_STATUS="+payroll["status"])
          print("CONTRACT_EMPLOYEES="+str(review["employee_count"]))
          print("PAYROLL_EMPLOYEES="+str(len(payroll["composition"]["worker_runs"])))
          print("PAY_BASES="+str(review["salary_based_worker_count"])+"/"+str(review["time_based_worker_count"]))
          print("SERVICE_EXCLUDED="+str(len(review["service_contracts"])))
          assert payroll["status"]=="REVIEW_REQUIRED"
          assert review["employee_count"]==80
          assert len(payroll["composition"]["worker_runs"])==80
          assert len(review["service_contracts"])==8
          assert review["time_based_premiums_calculated"] is False
          assert (root/"contract-basis-review.xlsx").is_file()
          PY
      - name: Run whole existing and new unittest suite
        run: python -m unittest discover -s bhandara/tests -p "test_*.py"
      - name: Commit actual XLSX examples (no generator-only PR)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bhandara/examples/sample/input/payroll \
                     bhandara/examples/sample/sample-manifest.json
          test "$(git diff --cached --name-only | grep -c '\.xlsx$')" -ge 4
          git commit -m "test(sample): publish 80 mixed wage contracts and 8 service Excel cases"
          git push origin HEAD:feat/payroll-contract-basis-20261112
