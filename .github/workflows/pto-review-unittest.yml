name: Bhandara PTO review tests

on:
  pull_request:
    paths:
      - "bhandara/pto-calculator/**"
      - "bhandara/tests/**"
      - ".github/workflows/pto-review-unittest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pto-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned public dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PTO XLSX stream row, employee, and provenance contracts
        run: python -m unittest discover -s bhandara/tests -p "test_pto_xlsx_stream_contract.py" -v
      - name: Run entire Bhandara unittest suite
        run: |
          python -m unittest discover -s bhandara/tests -p "test_*.py"
