name: Bhandara PTO review tests

on:
  pull_request:
    paths:
      - "bhandara/pto-calculator/**"
      - "bhandara/tests/test_pto_*.py"
      - ".github/workflows/pto-review-unittest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pto-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned public dependencies
        run: python -m pip install -r requirements.txt
      - name: Run standalone and mixed-case unittest
        run: |
          python -m unittest bhandara.tests.test_pto_standalone bhandara.tests.test_pto_case_studies
