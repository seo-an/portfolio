name: Bhandara shared Excel input unittest

on:
  pull_request:
    paths:
      - "bhandara/**"
      - "run.py"
      - ".github/workflows/bhandara-shared-layout-unittest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all Bhandara unittest
        run: python -m unittest discover -s bhandara/tests -p "test_*.py"
